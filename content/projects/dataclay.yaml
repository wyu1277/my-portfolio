briefText: >-
  Dataclay makes software that automates personalized video production,
  including Templater, an After Effects plugin. Their site was previously a
  stock Wordpress template.


  The goal was a clear layout for a large site with four products and many plan
  tiers, serving creatives, developers, and enterprise buyers.
constraint: >-
  The brand identity and color palette were finalized before I started, so my
  job was layout, organization, and applying the brand across the key pages.
processIntro: >-
  For each page I presented about three layout options to the company's
  technical lead and iterated on his feedback.
