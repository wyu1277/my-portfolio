outcomeShipped: >-
  Monthly reviews grew from about 9 a month in 2025 to about 61 a month between
  February and September 2026. The flagship product now shows [251, confirm in
  Judge.me] reviews at [4.7] in Google, and star ratings appear on every product
  listing in our ads. The average rating stayed steady (about 4.7 before the
  flow, about 4.8 now), so the problem was visibility and volume, not quality.
outcomeDifferently: >-
  Testing the effect of star ratings on click-through with a clean before and
  after, and tracking how many shoppers see ratings at each stage of search.
