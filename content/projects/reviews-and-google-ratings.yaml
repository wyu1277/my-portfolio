title: Making our reviews visible to Google
byline: Davek Accessories · Systems
summary: >-
  Connected Judge.me reviews to Google and built the review-request flow.
  Monthly reviews grew from about 9 to about 61.
category: systems
disciplines:
  - Systems
published: false
