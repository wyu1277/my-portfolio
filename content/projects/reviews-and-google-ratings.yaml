sortOrder: 2
role: Sole owner, from setup to monitoring
company: Davek Accessories
timeline: '[Start month] to present'
tools: Judge.me, Google Merchant Center, Shopify Flow
briefText: >-
  Searching for our flagship umbrella in Google showed almost no reviews, and
  our ads had no star ratings. The reviews existed, but Google couldn’t see
  them. Reviews collected through the Shop App were never published to Google,
  and nothing connected our ratings to Merchant Center or Google Ads.


  For a shopper comparing options in search, a missing rating looks like a
  missing track record.
options: []
decisions:
  - title: Connected the reviews to Google
    body: >-
      I set up a product ratings feed from Judge.me to Google Merchant Center
      and published the existing Shop App reviews, so they would appear on
      product listings and in ads.
  - title: A steady stream of new reviews
    body: >-
      I created an automated flow in Shopify Flow that sends a review request
      after an order is fulfilled, so reviews arrive continuously instead of in
      occasional bursts.
  - title: Keeping an eye on it
    body: >-
      I check incoming reviews weekly and pass low ratings to customer service
      for private follow-up.
