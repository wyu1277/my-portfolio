outcomeShipped: WAVE errors dropped from 20 to 0 on [page scanned, date], and
  the AIM score rose from 5.8 to 7.6 out of 10. All fixes shipped across three
  regional storefronts in about two weeks. [Add one contrast line after you
  check the 13 flagged items.] Automated results aren’t the same as full
  compliance, so I treat manual keyboard and screen reader testing as the real
  check.
outcomeDifferently: Automating the regression checklist so it runs on each theme
  update, and adding JAWS and VoiceOver to my testing.
