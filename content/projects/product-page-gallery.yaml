briefText: >-
  On desktop, the product description is long because it carries SEO copy that
  has to stay. As shoppers scrolled down to read it, the image was left behind,
  and roughly 1,000 pixels or more of empty space sat below it.


  Switching images was worse. The thumbnails sat at the bottom of a sticky
  gallery as tall as the viewport, so shoppers had to scroll down to change the
  image and back up to see it.
constraint: The SEO copy could not be cut, so the layout had to change instead.
  Mobile already had these features and no dead space, so this is desktop only.
processIntro: ""
options: []
afterReview: ""
decisions:
  - title: Benchmarking before building
    body: I looked at Blunt and Weatherman as direct competitors and IKEA as a
      general e-commerce benchmark. [What you took from each, one line apiece.]
    imageAlt: ""
  - title: Hover arrows to browse the whole gallery
    body: Hovering over the product image now shows arrows that step through every
      image, so shoppers no longer need the thumbnails. This did not exist
      before. A magnifying-glass cursor signals that the image can be clicked
      for a larger view.
    imageAlt: ""
  - title: No gallery navigation inside the modal
    body: I tried it, but high-resolution images loaded slowly. The fix would have
      been loading a low-resolution version first and swapping in the sharp one,
      and I judged the extra complexity wasn't worth it for a secondary view.
      The modal shows the chosen image, and the arrows on the page handle
      browsing.
    imageAlt: ""
