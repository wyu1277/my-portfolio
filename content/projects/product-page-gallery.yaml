shippedIntro: ""
outcomeShipped: The new gallery is live on all desktop product pages. It removed
  the dead space and kept the SEO copy. I built and tested it on a backup theme
  first, then added feedback from coworkers and a review from my boss. I used AI
  tools to help write the code, and I defined the behavior, tested every
  iteration in the browser, and directed the fixes.
outcomeDifferently: I didn't build accessibility into the modal at launch. I
  added keyboard and screen reader support later, and now it's part of my
  checklist before anything ships.
