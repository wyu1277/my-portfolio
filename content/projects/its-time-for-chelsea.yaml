briefText: >-
  It's Time for Chelsea was a campaign to bring shoppers to local businesses in
  Chelsea.


  I designed Instagram posts for individual businesses, ads for the screens at
  Chelsea Market, and ads for LinkNYC kiosks.
constraint: The campaign was built on the colors and framework of the citywide
  It's Time for NYC initiative, so the work had to look connected to it.
