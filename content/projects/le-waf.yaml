options: []
afterReview: ""
decisions:
  - title: Sketch first, polish later
    body: Sketching showed me that modular sections with generous white space suited
      a premium product, so I built the layouts around that.
    imageAlt: ""
  - title: Photography and story up front
    body: The homepage opens on a large product image and a short brand story.
      Product pages use big photography and describe the ingredients and the
      care behind each waffle.
    imageAlt: ""
  - title: Handoff with the engineers
    body: I imported the designs into InVision so the front-end engineers could
      inspect them and export CSS, and I worked with them on interactions the
      mockups didn't cover.
    imageAlt: ""
