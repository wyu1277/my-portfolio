briefText: >-
  Le Waf makes artisanal waffles and had gained attention from a Food Network
  appearance. Their existing site didn't look like the product: it didn't feel
  premium or show the craft behind it.


  They wanted a full redesign that built trust and made buying easy.
constraint: ""
