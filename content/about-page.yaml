lead: My initials are W-H-Y, so I took the hint.
body: >-
  I find the why before I start designing. On a product page, the why was a
  shopper scrolling past a thousand pixels of empty space to find the image
  again, and the answer was a new layout, which I designed and built. I'm a
  designer who codes, with a communication design degree from NYC College of
  Technology and a software engineering certificate from Fullstack Academy. I'm
  open to design and front-end roles in New York or remote.
tools: >-
  Figma, Illustrator, Photoshop, InDesign, HTML, CSS, JavaScript, Liquid, Bricks
  Builder, Shopify, Klaviyo, WCAG testing
portrait: /images/about/portrait.jpg
